name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Generate demo release report and gate
        run: |
          python -m app.qc_batch examples \
            --csv-output reports/qc_results.csv \
            --parquet-output reports/qc_results.parquet \
            --dataset-version ci-demo
          python -m app.release report reports/qc_results.parquet --html
          set +e
          python -m app.release gate reports/qc_results.parquet \
            --fail-on fatal \
            --output reports/release_gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qc-release-artifacts
          path: |
            reports/qc_report.md
            reports/qc_report.html
            reports/release_gate.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fr3-episode-qc:ci .
